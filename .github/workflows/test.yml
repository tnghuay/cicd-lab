name: Test Project

on:
  pull_requests:
    branches:
      - main

jobs:
  test:
    runs_on: ubuntu_latest
    container: 
      image: node:20
    steps:
      - uses: actions/checkout@v3
        with: 
          node-version: 20
      - run: npm ci 
      - run: npm test
      - run: npm run build
